[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qday"
version = "0.1.0"
description = "Continuous cryptographic inventory (CBOM) and PQC migration tracker"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qday = "qday.cli:main"

[tool.setuptools.packages.find]
include = ["qday*"]

[tool.setuptools.package-data]
"qday.scanners" = ["rules/*.yaml"]
