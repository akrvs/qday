language: go
file_extensions: [".go"]
rules:
  - id: go-rsa-generate
    pattern: 'rsa\.GenerateKey\s*\('
    algorithm: RSA
    key_size_pattern: 'rsa\.GenerateKey\s*\([^,]+,\s*(\d+)'
  - id: go-ecdsa-generate
    pattern: 'ecdsa\.GenerateKey\s*\('
    algorithm: ECDSA
  - id: go-elliptic-curve
    pattern: 'elliptic\.P(224|256|384|521)\s*\('
    algorithm: EC
  - id: go-ed25519
    pattern: 'ed25519\.GenerateKey\s*\('
    algorithm: EdDSA
  - id: go-x25519
    pattern: 'curve25519\.(ScalarBaseMult|X25519)'
    algorithm: X25519
  - id: go-dsa
    pattern: 'dsa\.GenerateKey\s*\('
    algorithm: DSA
