language: generic
file_extensions:
- '*'
rules:
- id: generic-embedded-rsa-key
  pattern: '-----BEGIN RSA PRIVATE KEY-----'
  algorithm: RSA
  note: private key committed to the repository
  keywords:
  - begin rsa private key
- id: generic-embedded-ec-key
  pattern: '-----BEGIN EC PRIVATE KEY-----'
  algorithm: EC
  note: private key committed to the repository
  keywords:
  - begin ec private key
- id: generic-embedded-private-key
  pattern: '-----BEGIN (ENCRYPTED )?PRIVATE KEY-----'
  algorithm: UNKNOWN
  note: PKCS#8 private key committed to the repository
  keywords:
  - private key-----
- id: generic-ssh-rsa-pubkey
  pattern: \bssh-rsa\s+AAAA
  algorithm: RSA
  keywords:
  - ssh-rsa
- id: generic-ssh-ecdsa-pubkey
  pattern: \becdsa-sha2-nistp(256|384|521)\s+AAAA
  algorithm: ECDSA
  keywords:
  - ecdsa-sha2
- id: generic-ssh-ed25519-pubkey
  pattern: \bssh-ed25519\s+AAAA
  algorithm: EdDSA
  keywords:
  - ssh-ed25519
- id: generic-openssl-genrsa
  pattern: \bopenssl\s+genrsa\b
  algorithm: RSA
  key_size_pattern: genrsa\b.*?(\d{3,5})\s*$
  keywords:
  - genrsa
- id: generic-openssl-ecparam
  pattern: \bopenssl\s+ecparam\b
  algorithm: EC
  keywords:
  - ecparam
